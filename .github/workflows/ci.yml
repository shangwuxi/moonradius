name: MoonBit checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Format check
        run: moon fmt --check
      - name: Static check
        run: moon check --target wasm-gc --deny-warn
      - name: Tests
        run: moon test --target wasm-gc
